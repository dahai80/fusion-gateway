name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build, Vet, Test
    # fusion-gateway is Apple-Silicon local-first: internal/hardware uses
    # macOS-only IOKit (purego) and sysctl swap-page counters with no
    # cross-platform stubs. CI runs on macOS to match the real deployment
    # target and compile the darwin-only hardware package.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      # A5 CI gate: ban bare `go func()`/`go call()` launches outside the
      # safeGo wrapper. A bare goroutine has no panic recovery; a single
      # panic in a background worker crashes the process. CLAUDE.md mandate:
      # "Background goroutines always go through safeGo". Runs before Build so
      # a violation fails fast.
      - name: Bare-goroutine gate
        run: bash scripts/check_bare_goroutines.sh

      - name: Build
        run: go build ./...

      # A5 CI gate: -race catches the concurrency bugs the audit flagged
      # (RWMutex-across-I/O, circuit-breaker lazy half_open, slot double-
      # release). macOS runners support -race. -count=1 disables test result
      # caching so a previously-passing-but-racy run re-runs fresh.
      - name: Test (race)
        run: go test ./... -count=1 -race

  # Enterprise SCA gate: govulncheck scans the 56 direct + transitive Go
  # dependencies against the Go vulnerability database (https://vuln.go.dev).
  # Fails the build on any known vulnerability that is actually reachable
  # from the module's call graph (-mode=source), not just declared in go.mod.
  # Runs as its own job so it parallelizes with build-test. macOS runner to
  # match the rest of CI (internal/hardware is darwin-only); govulncheck
  # itself is platform-agnostic but keeps a single runner class.
  vuln-scan:
    name: govulncheck (SCA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # Pin govulncheck to a tagged release so the scanner version is
      # reproducible across runs. Bump deliberately when a newer scanner
      # ships. Installed from the canonical module path (no third-party action
      # dependency, no network-pulled binary — built from source under the
      # pinned Go toolchain).
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # -mode=source: analyze the actual call graph so an unreachable
      # vulnerability in a dep that is compiled in but never called does NOT
      # fail the gate (reduces false positives). -show=verbose emits the call
      # stack so a triager can see the reachable path. Non-zero exit = a
      # reachable known vuln = CI red.
      - name: Scan for known vulnerabilities
        run: govulncheck -mode=source ./...
