name: Bug report
description: Defect report entering the governance state machine
labels: [state:proposal, type:bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or script to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Log excerpts / screenshot paths
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options: ["low", "high", "breaking"]
    validations:
      required: true
