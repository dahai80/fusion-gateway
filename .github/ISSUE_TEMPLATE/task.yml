name: Task
description: Lightweight config/chore task (defaults to state:approved, no G1 needed)
labels: [state:approved]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be done
    validations:
      required: true
  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Verifiable completion conditions
    validations:
      required: true
