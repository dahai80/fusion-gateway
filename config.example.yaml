server:
    host: "0.0.0.0"
    port: 8100

auth:
    enabled: true
    master_key: "fg-master-key-change-me"     # Bypasses rate limits and model allowlists
    api_keys:
        - key: "fg-demo-key-change-me"
          name: "demo"
          rpm: 60                              # Requests per minute per key
          tpm: 100000                          # Tokens per minute per key
          allowed_models:                      # Model allowlist (supports wildcards)
              - "gpt-4o*"
              - "claude-3*"
              - "qwen*"
          expires_at: ""                       # RFC3339 expiry, e.g. "2025-12-31T23:59:59Z"
          budget_limit: 0                      # Monthly budget in USD (0 = unlimited)
        - key: "fg-admin-key"
          name: "admin"
          rpm: 0                               # 0 = unlimited
          tpm: 0
          allowed_models:
              - "*"                            # Wildcard: all models allowed

route:
    enable_hardware_judge: true
    token_threshold: 8000
    local_max_memory_ratio: 0.9
    local_max_mlx_memory_ratio: 0.7
    local_max_concurrent: 8
    swap_page_rate_threshold: 100
    gpu_memory_ratio_threshold: 0.9
    token_tiers:
        enabled: false
        metric: "total"              # input | output | total
        rules:                       # evaluated top-to-bottom, first match wins
            # - max_tokens: 2000
            #   backend: "qianfan"
            # - max_tokens: 8000
            #   backend: "openai"
            # - max_tokens: 0        # 0 = no upper bound (catch-all)
            #   backend: "openai"
    fallback:
        cloud_default: "openai"
        context_window_fallback:     # When model exceeds local context, try larger model
            qwen2.5-0.5b: "qwen2.5-3b"
            qwen2.5-3b: "qwen2.5-7b"
    negotiation:
        route_header: "X-Fusion-Route"
        route_header_value: "gateway-decision"
    circuit_breaker:
        memory_overload: true
        swap_triggered: true
        model_offline: true
        failure_threshold: 5
        timeout: 30s
        half_open_max_requests: 3
        success_threshold: 3
    rate_limit:
        enabled: true
        global_rpm: 1000                   # Global RPM cap across all keys
        global_tpm: 10000000               # Global TPM cap across all keys
        key_enforcement: true              # Deny requests without key config when true
    retry:
        max_retries: 2                     # Max retry attempts for non-streaming
        initial_backoff: 500ms             # First retry backoff
        max_backoff: 10s                   # Max backoff cap
        retryable_status_codes:            # HTTP status codes that trigger retry
            - 429
            - 500
            - 502
            - 503

cache:
    enabled: true
    max_entries: 10000                     # Max cached responses
    ttl: 5m                               # Cache TTL
    max_memory_mb: 256                     # Max memory for cache (0 = unlimited)
    backend: "local"                       # local | redis
    redis:                                 # Redis config (only when backend=redis)
        addr: "localhost:6379"
        password: ""
        db: 0
        pool_size: 10
    warmup_file: ""                        # JSON file to preload cache at startup

cost:
    enabled: true
    pricing_file: ""                       # Optional: custom pricing YAML file
    budget_alert_threshold: 0.8            # Alert when 80% of key budget used

pii:
    enabled: false
    action: "log"                          # log | mask | deny
    patterns: []                           # Custom PII patterns
    # patterns:
    #     - name: "employee_id"
    #       regex: "EMP\\d{6}"

cloud_routing:
    strategy: "round-robin"                # latency | cost | weight | least-busy | round-robin
    cloud_weights:                         # Weights for weight-based strategy
        openai: 3
        deepseek: 1
        qianfan: 2

backends:
    fusion-mlx:
        type: "fusion-mlx"
        base_url: "http://127.0.0.1:11434"
        timeout: 120s
        enabled: true
        gc:
            enabled: true
            min_idle_since_last_gc: 5m
    openai:
        type: "openai-compatible"
        base_url: "https://api.openai.com/v1"
        api_key: "sk-your-openai-key"
        timeout: 60s
        enabled: true
    qianfan:
        type: "openai-compatible"
        base_url: "https://qianfan.baidubce.com/v2"
        api_key: "your-qianfan-key"
        timeout: 60s
        enabled: false
    anthropic:
        type: "anthropic"
        base_url: "https://api.anthropic.com"
        api_key: "sk-ant-your-key"
        timeout: 60s
        enabled: false
    volcengine:
        type: "volcengine"
        base_url: "https://ark.cn-beijing.volces.com/api/v3"
        api_key: "your-volcengine-key"
        timeout: 60s
        enabled: false
    deepseek:
        type: "deepseek"
        base_url: "https://api.deepseek.com"
        api_key: "your-deepseek-key"
        timeout: 60s
        enabled: false
    openrouter:
        type: "openrouter"
        base_url: "https://openrouter.ai/api/v1"
        api_key: "your-openrouter-key"
        timeout: 60s
        enabled: false
    dashscope:
        type: "dashscope"
        base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        api_key: "your-dashscope-key"
        timeout: 60s
        enabled: false
    moonshot:
        type: "moonshot"
        base_url: "https://api.moonshot.cn/v1"
        api_key: "your-moonshot-key"
        timeout: 60s
        enabled: false
    zhipu:
        type: "zhipu"
        base_url: "https://open.bigmodel.cn/api/paas/v4"
        api_key: "your-zhipu-key"
        timeout: 60s
        enabled: false
    minimax:
        type: "minimax"
        base_url: "https://api.minimax.chat/v1"
        api_key: "your-minimax-key"
        timeout: 60s
        enabled: false
    baichuan:
        type: "baichuan"
        base_url: "https://api.baichuan-ai.com/v1"
        api_key: "your-baichuan-key"
        timeout: 60s
        enabled: false
    hunyuan:
        type: "hunyuan"
        base_url: "https://api.hunyuan.cloud.tencent.com/v1"
        api_key: "your-hunyuan-key"
        timeout: 60s
        enabled: false
    stepfun:
        type: "stepfun"
        base_url: "https://api.stepfun.com/v1"
        api_key: "your-stepfun-key"
        timeout: 60s
        enabled: false
    yi:
        type: "yi"
        base_url: "https://api.lingyiwanwu.com/v1"
        api_key: "your-yi-key"
        timeout: 60s
        enabled: false

hardware:
    interval: 5
    enable_iokit: false
    enable_mlx_metrics: true
    mlx_metrics_url: "http://127.0.0.1:11434/metrics"

tokenizer:
    type: "whitespace"
    calibration:
        enabled: true
        sample_interval: 1000
        deviation_threshold: 0.02
        auto_switch_threshold: 0.05

observability:
    metrics_enabled: true
    metrics_path: "/metrics"
    namespace: "fusion_gateway"
    otel_enabled: false                   # Enable OpenTelemetry tracing
    otel_endpoint: "localhost:4317"       # OTel collector endpoint
    otel_protocol: "grpc"                 # grpc | http
    otel_service_name: "fusion-gateway"   # Service name in traces

cors:
    allowed_origins:
        - "*"
    allowed_methods:
        - "GET"
        - "POST"
        - "OPTIONS"
    allowed_headers:
        - "Content-Type"
        - "Authorization"
        - "X-Request-ID"
        - "X-Api-Key"

hot_reload:
    enabled: true
    debounce: 500ms

cluster:
    enabled: false
    mode: "standalone"                   # standalone | master
    nodes: []
    # nodes:
    #     - id: "mac-mini-m2"
    #       address: "http://192.168.1.100:8100"
    #       gpu: "M2"
    #       memory_gb: 16
    #     - id: "mac-studio-ultra"
    #       address: "http://192.168.1.101:8100"
    #       gpu: "M2Ultra"
    #       memory_gb: 128
    master:
        address: "http://127.0.0.1:9753"  # fusion-multi-node Master address
        shared_token: ""                   # authentication token
    load_balancer: "least-connections"   # least-connections | hardware-aware | round-robin
    health_check_interval: 10s
    failure_threshold: 3
    recovery_interval: 30s

realtime:
    enabled: false
    backend_url: "wss://api.openai.com/v1/realtime"
    api_key: ""                        # API key for the realtime backend
    max_message_mb: 1                  # Max WebSocket message size in MB

admin:
    enabled: true                      # Enable admin dashboard and API
    listen: ""                         # Optional separate listen address (default: same as server)
    log_max_len: 10000                 # Max request log entries (ring buffer)
    jwt_secret: "change-me-to-a-random-secret"  # JWT signing secret for admin auth
    credentials:                       # Admin login credentials
        - username: "admin"
          password: "admin"
