server:
    host: "0.0.0.0"
    port: 11432                           # Fusion-Gateway default port
    enable_pprof: false                   # Enable pprof debug endpoints (requires master_key auth)
    # tls:                                # HTTPS termination (optional, for single-binary deployment)
    #     cert_file: "certs/server.crt"
    #     key_file: "certs/server.key"
    auto_start:                           # Auto-start fusion-mlx on gateway startup (standalone fallback).
                                          # #141: skipped (and stop is a no-op) when fusion-supervisor
                                          # owns the lifecycle — FUSION_SV_ACTIVE=1 env or its UDS socket
                                          # /tmp/fusion-sv.sock present. Keep enabled for non-supervisor
                                          # hosts; the supervisor is authoritative on managed hosts.
        enabled: true
        command: "~/claude-home/fusion-mlx/start.sh start"
        stop_cmd: "~/claude-home/fusion-mlx/start.sh stop"
        wait_url: "http://127.0.0.1:11434/health"
        wait_secs: 120                    # Max seconds to wait for local backend health

encryption:
    master_key: ""                     # AES-256 master key for at-rest encryption (min 32 chars, leave empty to disable)

# connector:                            # SaaS connector framework (optional)
#     persistence_path: "data/connections.json"

auth:
    enabled: true
    # C1 (audit P1): config.Load REFUSES known placeholders (fg-*, your-*-key,
    # *-change-me, *-do-not-ship, ...) at startup. Replace ALL placeholder
    # values below with unique strong secrets BEFORE enabling auth in
    # production, or the gateway fails to start. A real key is >=32 random
    # chars; never commit a live key to this template.
    master_key: "fg-master-key-change-me"     # PLACEHOLDER — replace with >=32 random chars; Load refuses as-is
    api_keys:
        - key: "fg-demo-key-change-me"
          name: "demo"
          rpm: 60                              # Requests per minute per key
          tpm: 100000                          # Tokens per minute per key
          allowed_models:                      # Model allowlist (supports wildcards)
              - "gpt-4o*"
              - "claude-3*"
              - "qwen*"
              - "mlx-community--*"             # MLX community models incl. VL (e.g. mlx-community--Qwen2.5-VL-7B-Instruct-4bit)
          model_modules:                       # Module access for model-hub (chat, code, design, rag, agent)
              - "chat"
              - "code"
          expires_at: ""                       # RFC3339 expiry, e.g. "2025-12-31T23:59:59Z"
          budget_limit: 0                      # Monthly budget in USD (0 = unlimited)
        - key: "fg-admin-key"               # PLACEHOLDER — replace; Load refuses as-is
          name: "admin"
          rpm: 0                               # 0 = unlimited
          tpm: 0
          allowed_models:
              - "*"                            # Wildcard: all models allowed

route:
    mode: hybrid                              # local=全走本地, cloud=全走云端, hybrid=智能路由(按token/比例/硬件)
    enable_hardware_judge: true
    token_threshold: 8000
    output_input_ratio_threshold: 0.6       # 输出/输入token比 > 此值走云端(0=禁用)
    output_input_ratio_min_input_tokens: 32 # input token < 此值时跳过 ratio 判据(极小请求 ratio 失真, #48;0=用默认32)
    ratio_tiers:
        enabled: false                       # 启用按比例分段路由(启用后替代output_input_ratio_threshold)
        rules:                               # ratio <= max_ratio → backend，按顺序匹配
            - max_ratio: 0.6
              backend: volcengine
            - max_ratio: 0.8
              backend: dashscope
            - max_ratio: 0.9
              backend: qianfan
    local_max_memory_ratio: 0.9
    local_max_mlx_memory_ratio: 0.7
    local_max_concurrent: 8
    swap_page_rate_threshold: 100
    gpu_memory_ratio_threshold: 0.9
    token_tiers:
        enabled: false
        metric: "total"              # input | output | total
        rules:                       # evaluated top-to-bottom, first match wins
            # - max_tokens: 2000
            #   backend: "qianfan"
            # - max_tokens: 8000
            #   backend: "openai"
            # - max_tokens: 0        # 0 = no upper bound (catch-all)
            #   backend: "openai"
    fallback:
        cloud_default: "openai"
        enabled: true                        # Enable model_mapping below (alias -> backend model id)
        model_mapping:                       # Map client/SDK model aliases to the cloud backend's real model id
            claude-opus-4-7: "glm5.2"        # e.g. claude code sends claude-opus-4-7; LiteLLM serves glm5.2
        context_window_fallback:     # When model exceeds local context, try larger model
            qwen2.5-0.5b: "qwen2.5-3b"
            qwen2.5-3b: "qwen2.5-7b"
    negotiation:
        route_header: "X-Fusion-Route"
        route_header_value: "gateway-decision"
    multimodal:
        # Local vision model to force-route image/audio content blocks to
        # (local-first). Multimodal payloads are invisible to the router's
        # text-only signal; without this they map to a text-only cloud model
        # -> upstream 400 -> gateway 502. Empty = no local vision path.
        local_model: ""
        # #120 cloud VLM fallback: when the local node has no vision model
        # loaded, route multimodal /v1/chat/completions to this cloud backend
        # + model. e.g. fusion-browser Visual Grounding when local mlx lacks a
        # VLM. Empty cloud_backend = local-only (reject if no local VLM).
        cloud_backend: ""
        cloud_model: ""
    circuit_breaker:
        memory_overload: true
        swap_triggered: true
        model_offline: true
        failure_threshold: 5
        timeout: 30s
        half_open_max_requests: 3
        success_threshold: 3
    rate_limit:
        enabled: true
        global_rpm: 1000                   # Global RPM cap across all keys
        global_tpm: 10000000               # Global TPM cap across all keys
        key_enforcement: true              # Deny requests without key config when true
    retry:
        max_retries: 2                     # Max retry attempts for non-streaming
        initial_backoff: 500ms             # First retry backoff
        max_backoff: 10s                   # Max backoff cap
        retryable_status_codes:            # HTTP status codes that trigger retry
            - 429
            - 500
            - 502
            - 503
    stream:
        keepalive_interval: 15s             # SSE keepalive ping interval (0 = disabled); Anthropic native `event: ping`, client stays alive during slow reasoning
        idle_timeout: 180s                  # Mid-stream idle watchdog: no upstream event for this long cancels upstream + synthesizes clean message_stop (0 = disabled)
        resume_enabled: false               # #116/#139 resumable SSE on the local MLX path: gateway assigns per-event `id: <stream_id>:<seq>`, announces `X-Fusion-Stream-ID` + `X-Fusion-Stream-Resume-URL` headers, and buffers a rolling window so a client reconnect with `Last-Event-ID` replays buffered events then resumes live (no upstream re-run). Replay endpoint: /v1/stream/{stream_id}/events (namespace-neutral, #139) or /v1/messages/{stream_id}/events. OFF by default — holds the local slot for the whole generation (the cost of true mid-stream resumability). Cloud/first-party paths are never resumable (no upstream cursor protocol).
        resume_max_events: 256              # Per-stream rolling-window cap in events; oldest trimmed beyond this (a replay can only reach the last N events)
        resume_max_bytes: 1048576           # Per-stream rolling-window cap in bytes (1 MiB); trims oldest when exceeded
        resume_ttl: 10m                     # Buffer retention after stream open; a reconnect past this cannot resume and must restart (reaper evicts past-TTL entries)

cache:
    enabled: true
    max_entries: 10000                     # Max cached responses
    ttl: 5m                               # Cache TTL
    max_memory_mb: 256                     # Max memory for cache (0 = unlimited)
    backend: "local"                       # local | redis
    redis:                                 # Redis config (only when backend=redis)
        addr: "localhost:6379"
        password: ""
        db: 0
        pool_size: 10
    warmup_file: ""                        # JSON file to preload cache at startup

cost:
    enabled: true
    pricing_file: ""                       # Optional: custom pricing YAML file
    budget_alert_threshold: 0.8            # Alert when 80% of key budget used

pii:
    enabled: false
    action: "log"                          # log | mask | deny
    patterns: []                           # Custom PII patterns
    # patterns:
    #     - name: "employee_id"
    #       regex: "EMP\\d{6}"

cloud_routing:
    strategy: "round-robin"                # latency | cost | weight | least-busy | round-robin
    cloud_weights:                         # Weights for weight-based strategy
        openai: 3
        deepseek: 1
        qianfan: 2

backends:
    fusion-mlx:
        type: "fusion-mlx"
        base_url: "http://127.0.0.1:11434"
        api_key: ""                        # set to match fusion-mlx settings.json auth.api_key (local key, not a cloud credential)
        timeout: 120s
        enabled: true
        gc:
            enabled: true
            min_idle_since_last_gc: 5m
    fusion-kb:
        type: "fusion-kb"
        base_url: "http://127.0.0.1:11436"
        timeout: 120s
        enabled: true
    model-hub:
        type: "fusion-model-hub"
        base_url: "http://127.0.0.1:11444"
        api_key: ""
        timeout: 30s
        enabled: true
    openai:
        type: "openai-compatible"
        base_url: "https://api.openai.com/v1"
        api_key: "sk-your-openai-key"      # PLACEHOLDER — replace before enabling; Load refuses placeholder on enabled backends
        timeout: 60s
        enabled: false
    qianfan:
        type: "openai-compatible"
        base_url: "https://qianfan.baidubce.com/v2"
        api_key: "your-qianfan-key"
        timeout: 60s
        enabled: false
    anthropic:
        type: "anthropic"
        base_url: "https://api.anthropic.com"
        api_key: "sk-ant-your-key"
        timeout: 60s
        enabled: false
    bedrock:
        # AWS Bedrock (Anthropic Claude via SigV4). Creds from gateway env:
        # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, AWS_SESSION_TOKEN.
        type: "bedrock"
        base_url: "https://bedrock-runtime.us-east-1.amazonaws.com"
        timeout: 120s
        enabled: false
    vertex:
        # Google Vertex AI (Anthropic Claude via OAuth2 SA). Creds from env:
        # VERTEX_SERVICE_ACCOUNT_JSON or GOOGLE_APPLICATION_CREDENTIALS,
        # VERTEX_PROJECT_ID, VERTEX_REGION.
        type: "vertex"
        base_url: "https://us-central1-aiplatform.googleapis.com"
        timeout: 120s
        enabled: false
    foundry:
        # Azure AI Foundry (Anthropic Claude). Creds from env:
        # AZURE_API_KEY / AZURE_OPENAI_API_KEY or AZURE_ACCESS_TOKEN.
        type: "foundry"
        base_url: "https://your-foundry-resource.services.ai.azure.com"
        timeout: 120s
        enabled: false
    volcengine:
        type: "volcengine"
        base_url: "https://ark.cn-beijing.volces.com/api/v3"
        api_key: "your-volcengine-key"
        timeout: 60s
        enabled: false
    deepseek:
        type: "deepseek"
        base_url: "https://api.deepseek.com"
        api_key: "your-deepseek-key"
        timeout: 60s
        enabled: false
    openrouter:
        type: "openrouter"
        base_url: "https://openrouter.ai/api/v1"
        api_key: "your-openrouter-key"
        timeout: 60s
        enabled: false
    dashscope:
        type: "dashscope"
        base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        api_key: "your-dashscope-key"
        timeout: 60s
        enabled: false
    moonshot:
        type: "moonshot"
        base_url: "https://api.moonshot.cn/v1"
        api_key: "your-moonshot-key"
        timeout: 60s
        enabled: false
    zhipu:
        type: "zhipu"
        base_url: "https://open.bigmodel.cn/api/paas/v4"
        api_key: "your-zhipu-key"
        timeout: 60s
        enabled: false
    minimax:
        type: "minimax"
        base_url: "https://api.minimax.chat/v1"
        api_key: "your-minimax-key"
        timeout: 60s
        enabled: false
    baichuan:
        type: "baichuan"
        base_url: "https://api.baichuan-ai.com/v1"
        api_key: "your-baichuan-key"
        timeout: 60s
        enabled: false
    hunyuan:
        type: "hunyuan"
        base_url: "https://api.hunyuan.cloud.tencent.com/v1"
        api_key: "your-hunyuan-key"
        timeout: 60s
        enabled: false
    stepfun:
        type: "stepfun"
        base_url: "https://api.stepfun.com/v1"
        api_key: "your-stepfun-key"
        timeout: 60s
        enabled: false
    yi:
        type: "yi"
        base_url: "https://api.lingyiwanwu.com/v1"
        api_key: "your-yi-key"
        timeout: 60s
        enabled: false

hardware:
    interval: 5
    enable_iokit: false
    enable_mlx_metrics: true
    mlx_metrics_url: "http://127.0.0.1:11434/metrics"

tokenizer:
    type: "whitespace"
    calibration:
        enabled: true
        sample_interval: 1000
        deviation_threshold: 0.02
        auto_switch_threshold: 0.05

observability:
    metrics_enabled: true
    metrics_path: "/metrics"
    namespace: "fusion_gateway"
    otel_enabled: false                   # Enable OpenTelemetry tracing
    otel_endpoint: "localhost:4317"       # OTel collector endpoint
    otel_protocol: "grpc"                 # grpc | http
    otel_service_name: "fusion-gateway"   # Service name in traces

cors:
    allowed_origins:
        - "*"
    allowed_methods:
        - "GET"
        - "POST"
        - "OPTIONS"
    allowed_headers:
        - "Content-Type"
        - "Authorization"
        - "X-Request-ID"
        - "X-Api-Key"

hot_reload:
    enabled: true
    debounce: 500ms

cluster:
    enabled: false
    mode: "standalone"                   # standalone | master
    nodes: []
    # nodes:
    #     - id: "mac-mini-m2"
    #       address: "http://192.168.1.100:11432"
    #       gpu: "M2"
    #       memory_gb: 16
    #     - id: "mac-studio-ultra"
    #       address: "http://192.168.1.101:11432"
    #       gpu: "M2Ultra"
    #       memory_gb: 128
    master:
        address: "http://127.0.0.1:9753"  # fusion-multi-node Master address
        shared_token: ""                   # authentication token
        ignore_strategy: false             # #119 opt-out: true keeps the LOCAL
                                           # load_balancer strategy authoritative for
                                           # inference node selection even in master
                                           # mode. Default false — the gateway honors
                                           # the strategy the master owns
                                           # (master.RoutingSummary.Strategy), so a
                                           # strategy set in fusion-studio is the
                                           # single source of truth. Fallback to
                                           # load_balancer on fetch failure or opt-out.
    load_balancer: "least-connections"   # least-connections | hardware-aware | round-robin
                                           # In master mode this is the FALLBACK when
                                           # ignore_strategy=true or the master strategy
                                           # fetch fails.
    health_check_interval: 10s
    failure_threshold: 3
    recovery_interval: 30s
# Env: FUSION_CLUSTER_BACKEND=multi-node forces master mode (cluster.master.address
# must be set) without a config edit — 12-factor promotion for production. With an
# empty master.address the env var is a no-op (stays in the configured mode).

realtime:
    enabled: false
    backend_url: "wss://api.openai.com/v1/realtime"
    api_key: ""                        # API key for the realtime backend
    max_message_mb: 1                  # Max WebSocket message size in MB

admin:
    enabled: true                      # Enable admin dashboard and API
    listen: ""                         # Optional separate listen address (default: same as server)
    log_max_len: 10000                 # Max request log entries (ring buffer)
    jwt_secret: "change-me-at-least-32-chars-long-random-secret"  # PLACEHOLDER — replace with >=32 random chars; Load refuses as-is (JWT signing secret)
    users:                             # Admin login credentials (passwords min 8 chars)
        admin: "change-me-secure-password"   # PLACEHOLDER — replace with a unique strong password; Load refuses as-is
    enable_pprof: false                # Enable pprof profiling endpoints (requires master_key)

# A3 fix: persistent store backend selection (memory | redis)
store:
    backend: "memory"                  # "memory" for single-instance, "redis" for multi-instance
    data_dir: "~/.fusion-gateway/data" # memory store persistence dir (~ expanded); empty=non-persistent. keys/channels/teams CRUD survive restart. redis backend ignores this
    redis:
        addr: "localhost:6379"         # Redis address (only used when backend=redis)
        password: ""                   # Redis password
        db: 0                          # Redis database number
        pool_size: 10                  # Connection pool size

# #118: MCP cluster gateway — security-domain isolation + independent auth gate.
# When enabled, MCP routes (/mcp/v1/call, /mcp/v1/tools, etc.) require an MCP
# credential INDEPENDENT of the main auth chain, so auth.enabled=false does NOT
# open MCP. The credential is mcp.token (preferred, dedicated) falling back to
# auth.master_key; if both are empty with mcp.enabled=true, config load fails
# (fail-closed — MCP routes must not be anonymously reachable).
#
# listen_enabled (default false): start a DEDICATED MCP HTTP listener on
# host:port, serving MCP routes under the MCP auth gate as the sole middleware
# (isolated from the main :11432 mux). When false, MCP routes stay on the shared
# main mux under withMiddleware + the MCP auth gate layered on top. The
# dedicated listener drains before the main server on shutdown (F7 ordering).
mcp:
    enabled: false                      # Master switch for the MCP cluster gateway
    listen_enabled: false               # true = dedicated listener on host:port (security-domain isolation); false = MCP on shared main mux
    host: "127.0.0.1"                   # Dedicated MCP listener bind address (only used when listen_enabled=true)
    port: 11446                         # Dedicated MCP listener port (only used when listen_enabled=true)
    token: ""                           # MCP-specific bearer token (Authorization: Bearer <token>); empty falls back to auth.master_key
    token_budget: 10000000              # Total token budget across all MCP tool calls
    max_requests: 10000                 # Max concurrent/in-flight MCP requests
    node_port: 11445                    # Port dialed for remote MCP node execution (forwardToNode upstream)
    local_port: 9000                    # Port dialed for local MCP tool execution (forwardToNode localhost upstream)
    # #129 Gap 3: managed-MCP per-node tool allowlist. Enterprise tool names
    # permitted on THIS node. Empty/unset = unrestricted (every registered tool
    # admitted). Non-empty = a tool call whose name is NOT listed is rejected
    # at admission (before any node dial). Declared per-node by design — set
    # identically across nodes via deployment; converge on next restart. No
    # runtime fan-out needed (the list changes rarely). Hot-reloadable via
    # /admin/config/reload.
    managed_tool_allowlist: []          # e.g. ["search_kb", "run_sql", "fetch_doc"]

# #130: cross-node browser-session scheduling. The gateway acts as a placement
# coordinator for a pool of fusion-browser nodes (non-persistent single-node
# WKWebView automation engines, each exposing a UDS {type:"capacity"} plane).
# The gateway ranks nodes by headroom (most free_memory_mb, then fewest
# live_sessions) and pins each created session to a node for the rest of its
# life. Default-off: set enabled:true only when fusion-browser nodes are
# deployed. Routes (registered only when enabled):
#   POST   /v1/browser/sessions            create + place a session
#   POST   /v1/browser/sessions/{id}/actions  forward an action to the pinned node
#   DELETE /v1/browser/sessions/{id}       close + evict the pin (idempotent)
#   GET    /v1/browser/nodes               admin: node map (live/dead, capacity)
#   GET    /v1/browser/metrics             admin: opaque node metrics relay
browser:
    enabled: false                       # Master switch. false = no routes, no poll worker.
    poll_interval: "5s"                  # Capacity-poll cadence (jittered ±20%, H5).
    failure_threshold: 3                 # Consecutive poll failures before a node flips dead.
    recovery_interval: "30s"             # Dead-node re-probe backoff (avoid hammering a down node).
    global_max_sessions: 0               # 0 = no global ceiling; >0 caps sum(live_sessions) across nodes.
    min_free_mb_per_session: 200         # Memory floor: a node with free_memory_mb in (0, min) is skipped (free==0 = unknown, admitted).
    frame_max_bytes: 8388608             # UDS length-prefixed frame cap (8 MiB, mirrors fusion-browser Framing.swift).
    dial_timeout: "2s"                   # Per-call UDS dial timeout.
    frame_timeout: "30s"                 # Per-frame read timeout (partial-frame slow-drip drop, B-4).
    nodes: []                            # Static seed: [{id, socket_path, token}]. id is the stable registry key (survives browser restarts). Dial-in nodes self-register at runtime.
    # Example:
    # nodes:
    #     - id: "mbp-node-1"
    #       socket_path: "/tmp/fusion-browser.sock"
    #       token: "paste-the-node-authToken-here"   # MUST match the node's authToken (FR-10/H-5: first frame on every dial is an auth handshake). Empty/missing = node is deny-all; the op is rejected. NOTE: viper binds env vars to config KEYS, it does NOT expand inline ${VAR} inside string values — so a literal ${...} here would be sent verbatim and denied. Inject the real token via a secrets manager / env-overridden config file / template render before launch; do not commit real tokens.
    #     - id: "mbp-node-2"
    #       socket_path: "/tmp/fusion-browser-2.sock"
    #       token: "paste-the-node2-authToken-here"
