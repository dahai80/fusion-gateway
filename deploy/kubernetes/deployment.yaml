apiVersion: apps/v1
kind: Deployment
metadata:
  name: fusion-gateway
  namespace: fusion-gateway
  labels:
    app: fusion-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fusion-gateway
  template:
    metadata:
      labels:
        app: fusion-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "11432"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: fusion-gateway
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: fusion-gateway
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: fusion-gateway
      containers:
        - name: fusion-gateway
          image: fusion-gateway:latest
          ports:
            - containerPort: 11432
          env:
            - name: CONFIG_PATH
              value: /etc/fusion-gateway/config.yaml
            - name: FG_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: fusion-gateway-secrets
                  key: master_key
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/fusion-gateway
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /livez
              port: 11432
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 11432
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: fusion-gateway-config
