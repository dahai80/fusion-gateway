apiVersion: v1
kind: Secret
metadata:
  name: fusion-gateway-secrets
  namespace: fusion-gateway
type: Opaque
stringData:
  # master_key is injected into the pod as env FG_MASTER_KEY (deployment.yaml
  # secretKeyRef) and bound to config.auth.master_key by the gateway. Set a
  # unique >=32-char random value BEFORE applying, e.g.:
  #   openssl rand -hex 32
  # The gateway refuses to start if this is a known placeholder ("CHANGE_ME*",
  # "fg-*", "${...}") — fail-closed at startup. Leave empty to ship without a
  # master_key (guarded endpoints /metrics + /debug/pprof deny; admin auth needs
  # auth.enabled + api_keys).
  master_key: ""
  # Add API keys as needed (set unique strong values, never the fg-* placeholders):
  # api_key_demo: "<unique-strong-key>"
