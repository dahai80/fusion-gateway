apiVersion: v1
kind: ServiceAccount
metadata:
  name: fusion-gateway
  namespace: fusion-gateway
  labels:
    app.kubernetes.io/name: fusion-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fusion-gateway-config-reader
  namespace: fusion-gateway
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fusion-gateway-config-reader
  namespace: fusion-gateway
subjects:
  - kind: ServiceAccount
    name: fusion-gateway
roleRef:
  kind: Role
  name: fusion-gateway-config-reader
  apiGroup: rbac.authorization.k8s.io
