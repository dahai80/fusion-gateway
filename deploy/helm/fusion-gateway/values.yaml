replicaCount: 2

image:
  repository: fusion-gateway
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 11432

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

livenessProbe:
  httpGet:
    path: /livez
    port: 11432
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: 11432
  initialDelaySeconds: 3
  periodSeconds: 5

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

secrets:
  master_key: "CHANGE_ME_MASTER_KEY"

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: fusion-gateway.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: fusion-gateway-tls
      hosts:
        - fusion-gateway.example.com

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60

pdb:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx

topologySpreadConstraints:
  enabled: true
  zone:
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  host:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

config:
  server:
    host: "0.0.0.0"
    port: 11432
  auth:
    master_key: "${FG_MASTER_KEY}"
  route:
    enable_hardware_judge: false
    token_threshold: 50
