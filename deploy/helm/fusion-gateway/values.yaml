replicaCount: 2

image:
  repository: fusion-gateway
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 11432

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

livenessProbe:
  httpGet:
    path: /livez
    port: 11432
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: 11432
  initialDelaySeconds: 3
  periodSeconds: 5

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

secrets:
  # master_key is injected into the pod as env FG_MASTER_KEY (see
  # templates/deployment.yaml secretKeyRef) and bound to config.auth.master_key
  # by the gateway's bindSecretEnv — the env var is the source of truth, NOT a
  # configmap literal. Leave empty to ship WITHOUT a master_key (guarded
  # endpoints /metrics + /debug/pprof deny; admin auth needs auth.enabled +
  # api_keys). Set a unique >=32-char random value for any production deploy:
  #   helm install ... --set secrets.master_key=$(openssl rand -hex 32)
  # The gateway refuses to start if this ends up a known placeholder
  # ("CHANGE_ME*", "fg-*", "${...}") — the startup guard is fail-closed.
  master_key: ""

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: fusion-gateway.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: fusion-gateway-tls
      hosts:
        - fusion-gateway.example.com

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60

pdb:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx

topologySpreadConstraints:
  enabled: true
  zone:
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  host:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

config:
  server:
    host: "0.0.0.0"
    port: 11432
  # NOTE: auth.master_key is intentionally NOT set here. The deployment injects
  # the real master_key via env FG_MASTER_KEY (secretKeyRef →
  # secrets.master_key), and the gateway binds that env to auth.master_key
  # (bindSecretEnv). A literal here — especially "${FG_MASTER_KEY}" — would be
  # sent VERBATIM (viper does not expand inline ${VAR} in YAML strings) and
  # become a publicly-predictable admin-bypass key, so master_key must come from
  # the env/Secret, never the configmap. The startup guard rejects any
  # placeholder literal that does leak in.
  auth: {}
  route:
    enable_hardware_judge: false
    token_threshold: 50
