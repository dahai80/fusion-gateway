{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fusion-gateway.serviceAccountName" . }}
  labels:
    {{- include "fusion-gateway.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fusion-gateway.fullname" . }}-config-reader
  labels:
    {{- include "fusion-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fusion-gateway.fullname" . }}-config-reader
  labels:
    {{- include "fusion-gateway.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "fusion-gateway.serviceAccountName" . }}
roleRef:
  kind: Role
  name: {{ include "fusion-gateway.fullname" . }}-config-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
