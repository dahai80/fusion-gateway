apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fusion-gateway.fullname" . }}-secrets
  labels:
    {{- include "fusion-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Only emit master_key when the operator set secrets.master_key. A bare
       `helm install` ships no master_key (safe-by-default: guarded endpoints
       deny; admin auth needs auth.enabled + api_keys) rather than a known
       placeholder. The default "CHANGE_ME" is intentionally NOT used — the
       gateway's startup guard would reject it, and shipping a known secret in a
       default is a footgun. */ -}}
  {{- with .Values.secrets.master_key }}
  master_key: {{ . | quote }}
  {{- end }}
